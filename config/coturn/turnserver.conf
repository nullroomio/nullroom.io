# Network
listening-port=3478
tls-listening-port=443
min-port=49152
max-port=50152

# Bind only to the floating IP (passed via CLI: --listening-ip="$EXTERNAL_IP")
# listening-ip is set at runtime to avoid hardcoding the IP here.

# Domain
realm=nullroom.io
server-name=turn.nullroom.io

# TLS (certs copied by certbot deploy hook with correct permissions)
cert=/var/lib/coturn/certs/fullchain.pem
pkey=/var/lib/coturn/certs/privkey.pem

# Authentication - use long-term credential mechanism with shared secret
# The actual secret value is passed via --static-auth-secret CLI flag
lt-cred-mech
use-auth-secret

# Security
no-multicast-peers
no-cli
no-software-attribute
fingerprint

# Logging (zero-trace: all logging disabled)
no-stdout-log
no-syslog
log-file=/dev/null

# Restrict relay to prevent abuse (block private/reserved ranges)
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
